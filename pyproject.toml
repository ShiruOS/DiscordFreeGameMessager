[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Free-Game-Announcer-2.0"
version = "0.1.0"
description = "A simple program that sends news about free games and offeres on discord"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "discord-webhook>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest",
]
