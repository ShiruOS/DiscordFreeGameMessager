name: Run Free Game Announcer

on:
  schedule:
    - cron: "30 18 * * *" # Runs every day at 12:00 UTC
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip" # Speeds up subsequent runs

      - name: Install Project
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install .

      - name: Run Announcer
        env: |
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          API_URL: $ {{secrets.API_URL}}
        run: |
          source .venv/bin/activate
          run-announcer
