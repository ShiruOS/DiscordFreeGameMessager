name: News automation

# This trigger allows you to start the workflow manually from the Actions tab
on:
  workflow_dispatch:

jobs:
  run-python-task:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the code from your repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # You can change this to your preferred version

      # 3. Install dependencies from requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Execute the script
      # This passes your GitHub Secret as an environment variable
      - name: Run Python Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CRASH_BOY: ${{ secrets.CRASH_BOY }}
          NEWS_API: ${{ secrets.NEWS_API }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TABLE: ${{ secrets.TABLE }}
        run: python main.py # Replace main.py with your actual filename
